<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Namma Gallery 💜</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Work+Sans:wght@400;500;600&display=swap');

  :root{
    --deep: #2b0a4a;
    --mid: #5b1e9c;
    --light: #9b5de5;
    --pink: #f15bb5;
    --cream: #fdf6ff;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  html, body{
    height:100%;
    font-family:'Work Sans', sans-serif;
    background: #0d0518;
    color: var(--cream);
    overflow-x: hidden;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding: 24px 12px;
  }

  .device{
    width: 375px;
    max-width: 100%;
    height: 780px;
    max-height: 92vh;
    background: #120a1e;
    border-radius: 46px;
    padding: 14px;
    box-shadow: 0 30px 70px rgba(0,0,0,0.55), 0 0 0 2px rgba(255,255,255,0.05) inset;
    position: relative;
  }
  .device::before{
    content:"";
    position:absolute;
    top: 22px;
    left:50%;
    transform: translateX(-50%);
    width: 90px;
    height: 22px;
    background:#120a1e;
    border-radius: 20px;
    z-index: 5;
  }
  .device::after{
    content:"";
    position:absolute;
    bottom: 10px;
    left:50%;
    transform: translateX(-50%);
    width: 120px;
    height: 4px;
    background: rgba(255,255,255,0.35);
    border-radius: 4px;
    z-index: 5;
  }

  .phone{
    width: 100%;
    height: 100%;
    border-radius: 32px;
    background: radial-gradient(circle at 50% 0%, var(--mid) 0%, var(--deep) 65%, #180330 100%);
    position: relative;
    overflow: hidden;
  }

  .stage{
    height:100%;
    width:100%;
    overflow-y:auto;
    padding: 40px 20px 40px;
    position:relative;
  }

  .hearts{
    position:absolute;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:0;
  }
  .heart{
    position:absolute;
    bottom:-10%;
    font-size: 20px;
    opacity:0.5;
    filter: drop-shadow(0 0 6px rgba(241,91,181,0.5));
    animation: rise linear infinite;
  }
  @keyframes rise{
    0%{ transform: translateY(0) translateX(0) rotate(0deg); opacity:0; }
    10%{ opacity:0.6; }
    100%{ transform: translateY(-820px) translateX(var(--drift,20px)) rotate(20deg); opacity:0; }
  }

  .title{
    position:relative;
    z-index:2;
    text-align:center;
    font-family:'Fraunces', serif;
    font-size: 1.8rem;
    font-weight:700;
    color: var(--cream);
    text-shadow: 0 0 18px rgba(155,93,229,0.6);
  }
  .subtitle{
    position:relative;
    z-index:2;
    text-align:center;
    font-size: 0.85rem;
    color: var(--pink);
    letter-spacing: 2px;
    margin-top: 4px;
    margin-bottom: 26px;
  }

  .gallery{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    gap: 18px;
  }
  .gallery figure{
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px;
    padding: 10px;
    backdrop-filter: blur(10px);
    box-shadow: 0 14px 34px rgba(0,0,0,0.4);
  }
  .gallery img{
    width:100%;
    border-radius: 14px;
    display:block;
  }
  .gallery figcaption{
    margin-top: 8px;
    text-align:center;
    font-size: 0.8rem;
    color: rgba(253,246,255,0.75);
  }

  .back-btn{
    position:relative;
    z-index:2;
    display:block;
    width:100%;
    margin-top: 26px;
    margin-bottom: 6px;
    padding: 13px;
    border:none;
    border-radius: 14px;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.3);
    color: rgba(253,246,255,0.85);
    font-weight:500;
    font-size: 0.95rem;
    cursor:pointer;
  }
  .back-btn:hover{ background: rgba(255,255,255,0.06); }
</style>
</head>
